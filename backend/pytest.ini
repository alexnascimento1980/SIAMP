[pytest]
# Sem isto, `pytest -v` (o comando "puro", sem `python -m`) não adiciona
# automaticamente a pasta backend/ ao sys.path em todas as plataformas -
# só `python -m pytest` faz isso (o `-m` do Python insere o diretório
# atual no sys.path). Resultado sem isto: "ModuleNotFoundError: No
# module named 'app'" ao rodar o comando bare `pytest` de dentro de
# backend/, mesmo com o ambiente virtual e as dependências corretas.
pythonpath = .

# Avisos de bibliotecas de terceiros que não dá para corrigir aqui e só
# poluíam a saída (ex.: 602 repetições do aviso do joblib a cada carga do
# modelo de risco). Cada filtro mira um aviso específico de um módulo
# específico, para que avisos NOVOS - e os do código do projeto - continuem
# aparecendo.
filterwarnings =
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib\.numpy_pickle
    ignore:ast\.NameConstant is deprecated:DeprecationWarning:reportlab\..*
    ignore:The anyio\.abc\.BlockingPortal alias is deprecated:DeprecationWarning:starlette\.testclient
