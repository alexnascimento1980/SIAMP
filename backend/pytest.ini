[pytest]
# Sem isto, `pytest -v` (o comando "puro", sem `python -m`) não adiciona
# automaticamente a pasta backend/ ao sys.path em todas as plataformas -
# só `python -m pytest` faz isso (o `-m` do Python insere o diretório
# atual no sys.path). Resultado sem isto: "ModuleNotFoundError: No
# module named 'app'" ao rodar o comando bare `pytest` de dentro de
# backend/, mesmo com o ambiente virtual e as dependências corretas.
pythonpath = .
