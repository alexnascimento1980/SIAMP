<!doctype html>
<html lang="pt-BR">
  <head>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>SIAMP - Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body
    class="bg-light d-flex align-items-center justify-content-center vh-100"
  >
    <div class="card shadow-sm" style="width: 100%; max-width: 380px">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-cpu text-primary" style="font-size: 2.5rem"></i>
          <h4 class="fw-bold mt-2 mb-0">SIAMP</h4>
          <p class="text-secondary small mb-0">
            Registro Operacional de Produção
          </p>
        </div>

        <div
          id="alertaErro"
          class="alert alert-danger py-2 small d-none"
          role="alert"
        ></div>

        <form id="formLogin" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label fw-bold text-secondary"
              >E-mail</label
            >
            <input
              type="email"
              id="email"
              class="form-control form-control-lg"
              placeholder="seu.email@empresa.com"
              required
              autofocus
            />
          </div>
          <div class="mb-3">
            <label for="senha" class="form-label fw-bold text-secondary"
              >Senha</label
            >
            <input
              type="password"
              id="senha"
              class="form-control form-control-lg"
              placeholder="••••••••"
              required
            />
          </div>
          <button
            type="submit"
            id="btnEntrar"
            class="btn btn-primary btn-lg w-100 mt-2"
          >
            <span id="btnEntrarTexto">Entrar</span>
            <span
              id="btnEntrarSpinner"
              class="spinner-border spinner-border-sm ms-2 d-none"
              role="status"
              aria-hidden="true"
            ></span>
          </button>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
