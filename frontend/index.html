<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>SIAMP - Apontamento de Turno</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="bg-light">
    <!-- Barra Superior -->
    <nav class="navbar navbar-dark bg-primary px-3 shadow-sm">
      <div
        class="container-fluid d-flex justify-content-between align-items-center"
      >
        <span class="navbar-brand mb-0 h1 fw-bold">
          <i class="bi bi-cpu me-2"></i>SIAMP • Registro Operacional
        </span>
        <div class="d-flex align-items-center gap-3">
          <span id="relogio" class="text-white fw-bold"></span>
          <a
            id="linkUsuarios"
            href="usuarios.html"
            class="btn btn-sm btn-outline-light d-none"
          >
            <i class="bi bi-people me-1"></i>Usuários
          </a>
          <button class="btn btn-sm btn-outline-light" onclick="sair()">
            <i class="bi bi-box-arrow-right me-1"></i>Sair
          </button>
        </div>
      </div>
    </nav>

    <div class="container-fluid p-3">
      <!-- 1. Cabeçalho de Identificação do Turno -->
      <div class="card shadow-sm mb-3">
        <div class="card-body p-3">
          <div class="row g-2">
            <div class="col-md-4 col-sm-6">
              <label class="form-label fw-bold text-secondary mb-1"
                >Turno de Trabalho</label
              >
              <select
                id="selectTurno"
                class="form-select form-select-lg"
                onchange="atualizarHorariosTurno()"
              >
                <option value="1">1º Turno (05:00 - 13:00)</option>
                <option value="2">2º Turno (14:00 - 21:00)</option>
                <option value="3">3º Turno (22:00 - 04:00)</option>
              </select>
            </div>
            <div class="col-md-5 col-sm-6">
              <label class="form-label fw-bold text-secondary mb-1"
                >Líder / Responsável</label
              >
              <input
                type="text"
                id="nomeLider"
                class="form-control form-control-lg"
                placeholder="Nome do Líder"
              />
            </div>
            <div class="col-md-3 col-sm-12">
              <label class="form-label fw-bold text-secondary mb-1">Data</label>
              <input
                type="date"
                id="dataTurno"
                class="form-control form-control-lg"
              />
            </div>
          </div>
        </div>
      </div>

      <!-- 2. Seletor de Máquinas (Abas Injetoras 1 a 6) -->
      <ul
        class="nav nav-pills nav-fill mb-3 bg-white p-2 rounded shadow-sm gap-1"
        id="pills-maquinas"
      >
        <li class="nav-item">
          <button
            class="nav-link active btn-maq"
            onclick="selecionarMaquina(1)"
          >
            Injetora 1
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link btn-maq" onclick="selecionarMaquina(2)">
            Injetora 2
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link btn-maq" onclick="selecionarMaquina(3)">
            Injetora 3
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link btn-maq" onclick="selecionarMaquina(4)">
            Injetora 4
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link btn-maq" onclick="selecionarMaquina(5)">
            Injetora 5
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link btn-maq" onclick="selecionarMaquina(6)">
            Injetora 6
          </button>
        </li>
      </ul>

      <!-- 3. Tabela de Apontamento Horário da Máquina Selecionada -->
      <div class="card shadow-sm mb-3">
        <div
          class="card-header bg-white d-flex justify-content-between align-items-center py-2"
        >
          <h5 class="mb-0 fw-bold text-primary" id="tituloMaquina">
            Injetora 1
          </h5>
          <div class="badge bg-secondary fs-6" id="badgeDetalheMaquina">
            Cavidades: 4 | Ciclo: 18.5s
          </div>
        </div>
        <div class="card-body p-0 table-responsive">
          <table
            class="table table-striped table-hover align-middle mb-0 text-center"
          >
            <thead class="table-light">
              <tr>
                <th style="width: 15%">Hora</th>
                <th style="width: 25%">Prod. Executada (pçs)</th>
                <th style="width: 20%">Parada</th>
                <th style="width: 20%">Retomada</th>
                <th style="width: 20%">Motivo Parada</th>
              </tr>
            </thead>
            <tbody id="corpoTabelaApontamento">
              <!-- Linhas geradas dinamicamente pelo JS -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- 4. Observações e Fechamento -->
      <div class="card shadow-sm mb-4">
        <div class="card-body p-3">
          <label class="form-label fw-bold text-secondary"
            >Observações Gerais do Turno</label
          >
          <textarea
            id="observacoesTurno"
            class="form-control"
            rows="2"
            placeholder="Ocorrências relevantes, manutenções, ajustes de processo..."
          ></textarea>
        </div>
        <div class="card-footer bg-white text-end p-3">
          <button
            class="btn btn-success btn-lg px-4 shadow"
            onclick="confirmarFechamento()"
          >
            <i class="bi bi-check-circle me-2"></i>Assinar e Finalizar Turno
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
