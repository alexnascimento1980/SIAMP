server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # home.html é a página pública inicial ("/"). index.html continua
    # sendo a tela de apontamento (protegida por sessão via JS) - só não
    # é mais o documento padrão da raiz, para não expor a casca da
    # aplicação antes do login.
    index home.html index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
