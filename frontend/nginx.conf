server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # home.html é a página pública inicial ("/"). index.html continua
    # sendo a tela de apontamento - só não é mais o documento padrão da
    # raiz.
    index home.html index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
