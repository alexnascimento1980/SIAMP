<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIAMP - Peças</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

  <!-- Barra Superior -->
  <nav class="navbar navbar-dark bg-primary px-3 shadow-sm">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <span class="navbar-brand mb-0 h1 fw-bold">
        <i class="bi bi-box-seam me-2"></i>SIAMP • Peças
      </span>
      <div class="d-flex align-items-center gap-2">
        <a href="index.html" class="btn btn-sm btn-outline-light">
          <i class="bi bi-arrow-left me-1"></i>Voltar
        </a>
        <button class="btn btn-sm btn-outline-light" onclick="sair()">
          <i class="bi bi-box-arrow-right me-1"></i>Sair
        </button>
      </div>
    </div>
  </nav>

  <div class="container-fluid p-3" style="max-width: 1000px;">

    <div id="alertaMsg" class="alert d-none" role="alert"></div>

    <!-- Formulário de nova peça -->
    <div class="card shadow-sm mb-3">
      <div class="card-header bg-white py-2">
        <h5 class="mb-0 fw-bold text-primary"><i class="bi bi-plus-circle me-2"></i>Nova Peça</h5>
      </div>
      <div class="card-body p-3">
        <form id="formNovaPeca">
          <div class="row g-2">
            <div class="col-md-2">
              <label class="form-label fw-bold text-secondary mb-1">Código</label>
              <input type="text" id="novoCodigo" class="form-control" placeholder="Ex: 50" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold text-secondary mb-1">Descrição</label>
              <input type="text" id="novaDescricao" class="form-control" placeholder="Ex: Tube Alimentation 1/2" required>
            </div>
            <div class="col-md-2">
              <label class="form-label fw-bold text-secondary mb-1">Ciclo médio (s)</label>
              <input type="number" id="novoCiclo" class="form-control" min="0.1" step="0.1" placeholder="opcional">
            </div>
            <div class="col-md-2">
              <label class="form-label fw-bold text-secondary mb-1">Cavidades</label>
              <input type="number" id="novaCavidades" class="form-control" min="1" placeholder="opcional">
            </div>
            <div class="col-md-2">
              <label class="form-label fw-bold text-secondary mb-1">Peso (g)</label>
              <input type="number" id="novoPeso" class="form-control" min="0.1" step="0.1" placeholder="opcional">
            </div>
          </div>
          <div class="form-text mt-1">
            Ciclo e cavidades são opcionais: quando não informados, o
            apontamento usa os valores padrão da máquina no cálculo do OEE.
          </div>
          <div class="text-end mt-3">
            <button type="submit" id="btnCriarPeca" class="btn btn-primary">
              <i class="bi bi-check-circle me-1"></i>Adicionar Peça
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Lista de peças -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-white py-2 d-flex justify-content-between align-items-center">
        <h5 class="mb-0 fw-bold text-primary"><i class="bi bi-list-ul me-2"></i>Peças Cadastradas</h5>
        <div class="d-flex align-items-center gap-3">
          <input
            type="search"
            id="filtroPecas"
            class="form-control form-control-sm"
            placeholder="Filtrar por código ou descrição..."
            style="width: 220px"
            oninput="renderizarPecas()"
          >
          <div class="form-check form-switch mb-0">
            <input class="form-check-input" type="checkbox" id="chkMostrarInativas" onchange="carregarPecas()">
            <label class="form-check-label small text-secondary" for="chkMostrarInativas">Mostrar inativas</label>
          </div>
        </div>
      </div>
      <div class="card-body p-0 table-responsive">
        <table class="table table-striped table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Código</th>
              <th>Descrição</th>
              <th class="text-center">Ciclo (s)</th>
              <th class="text-center">Cavidades</th>
              <th class="text-center">Peso (g)</th>
              <th class="text-center">Status</th>
              <th class="text-center">Ação</th>
            </tr>
          </thead>
          <tbody id="corpoTabelaPecas">
            <tr><td colspan="7" class="text-center text-secondary py-3">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal de edição -->
  <div class="modal fade" id="modalEditarPeca" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-pencil-square me-2"></i>Editar Peça</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="formEditarPeca">
          <div class="modal-body">
            <input type="hidden" id="editId">
            <div class="mb-2">
              <label class="form-label fw-bold text-secondary mb-1">Código</label>
              <input type="text" id="editCodigo" class="form-control" disabled>
            </div>
            <div class="mb-2">
              <label class="form-label fw-bold text-secondary mb-1">Descrição</label>
              <input type="text" id="editDescricao" class="form-control" required>
            </div>
            <div class="row g-2">
              <div class="col-4">
                <label class="form-label fw-bold text-secondary mb-1">Ciclo (s)</label>
                <input type="number" id="editCiclo" class="form-control" min="0.1" step="0.1">
              </div>
              <div class="col-4">
                <label class="form-label fw-bold text-secondary mb-1">Cavidades</label>
                <input type="number" id="editCavidades" class="form-control" min="1">
              </div>
              <div class="col-4">
                <label class="form-label fw-bold text-secondary mb-1">Peso (g)</label>
                <input type="number" id="editPeso" class="form-control" min="0.1" step="0.1">
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-circle me-1"></i>Salvar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pecas.js"></script>
</body>
</html>
