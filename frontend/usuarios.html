<!doctype html>
<html lang="pt-BR">
  <head>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>SIAMP - Usuários</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="bg-light">
    <!-- Barra Superior -->
    <nav class="navbar navbar-dark bg-primary px-3 shadow-sm">
      <div
        class="container-fluid d-flex justify-content-between align-items-center"
      >
        <span class="navbar-brand mb-0 h1 fw-bold">
          <i class="bi bi-people me-2"></i>SIAMP • Usuários
        </span>
        <div class="d-flex align-items-center gap-2">
          <a href="home.html" class="btn btn-sm btn-outline-light">
            <i class="bi bi-arrow-left me-1"></i>Voltar
          </a>
          <button class="btn btn-sm btn-outline-light" onclick="sair()">
            <i class="bi bi-box-arrow-right me-1"></i>Sair
          </button>
        </div>
      </div>
    </nav>

    <div class="container-fluid p-3" style="max-width: 900px">
      <div id="alertaMsg" class="alert d-none" role="alert"></div>

      <!-- Formulário de novo usuário -->
      <div class="card shadow-sm mb-3">
        <div class="card-header bg-white py-2">
          <h5 class="mb-0 fw-bold text-primary">
            <i class="bi bi-person-plus me-2"></i>Novo Usuário
          </h5>
        </div>
        <div class="card-body p-3">
          <form id="formNovoUsuario">
            <div class="row g-2">
              <div class="col-md-4">
                <label class="form-label fw-bold text-secondary mb-1"
                  >Nome</label
                >
                <input
                  type="text"
                  id="novoNome"
                  class="form-control"
                  required
                />
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold text-secondary mb-1"
                  >E-mail</label
                >
                <input
                  type="email"
                  id="novoEmail"
                  class="form-control"
                  required
                />
              </div>
              <div class="col-md-2">
                <label class="form-label fw-bold text-secondary mb-1"
                  >Perfil</label
                >
                <select id="novoPerfil" class="form-select">
                  <option value="OPERADOR" selected>Operador</option>
                  <option value="SUPERVISOR">Supervisor</option>
                  <option value="ADMIN">Admin</option>
                </select>
              </div>
              <div class="col-md-2">
                <label class="form-label fw-bold text-secondary mb-1"
                  >Senha</label
                >
                <input
                  type="password"
                  id="novaSenha"
                  class="form-control"
                  minlength="8"
                  required
                />
              </div>
            </div>
            <div class="text-end mt-3">
              <button type="submit" id="btnCriar" class="btn btn-primary">
                <i class="bi bi-check-circle me-1"></i>Cadastrar
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Lista de usuários -->
      <div class="card shadow-sm mb-4">
        <div class="card-header bg-white py-2">
          <h5 class="mb-0 fw-bold text-primary">
            <i class="bi bi-list-ul me-2"></i>Usuários Cadastrados
          </h5>
        </div>
        <div class="card-body p-0 table-responsive">
          <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Perfil</th>
                <th class="text-center">Status</th>
                <th class="text-center">Ação</th>
              </tr>
            </thead>
            <tbody id="corpoTabelaUsuarios">
              <tr>
                <td colspan="5" class="text-center text-secondary py-3">
                  Carregando...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/usuarios.js"></script>
  </body>
</html>
