<!doctype html>
<html lang="pt-BR">
  <head>
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>SIAMP - Histórico de Turnos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="bg-light">
    <!-- Barra Superior -->
    <nav class="navbar navbar-dark bg-primary px-3 shadow-sm">
      <div
        class="container-fluid d-flex justify-content-between align-items-center"
      >
        <span class="navbar-brand mb-0 h1 fw-bold d-flex align-items-center">
          <img src="img/siamp-logo-branco.png" alt="SIAMP" height="26" class="me-2" /> • Histórico de Turnos
        </span>
        <div class="d-flex align-items-center gap-2">
          <a href="home.html" class="btn btn-sm btn-outline-light">
            <i class="bi bi-arrow-left me-1"></i>Voltar
          </a>
          <button class="btn btn-sm btn-outline-light" onclick="sair()">
            <i class="bi bi-box-arrow-right me-1"></i>Sair
          </button>
        </div>
      </div>
    </nav>

    <div class="container-fluid p-3" style="max-width: 1100px">
      <div id="alertaMsg" class="alert d-none" role="alert"></div>

      <!-- Exportação para Excel / Power BI -->
      <div class="card shadow-sm mb-3">
        <div class="card-body p-3">
          <h6 class="fw-bold text-secondary mb-2">
            <i class="bi bi-file-earmark-spreadsheet me-2"></i>Exportar dados (Excel, Power BI)
          </h6>
          <div class="row g-2 align-items-end">
            <div class="col-md-3">
              <label class="form-label small mb-1">De (opcional)</label>
              <input type="date" id="exportDataInicio" class="form-control form-control-sm">
            </div>
            <div class="col-md-3">
              <label class="form-label small mb-1">Até (opcional)</label>
              <input type="date" id="exportDataFim" class="form-control form-control-sm">
            </div>
            <div class="col-md-6">
              <button class="btn btn-outline-primary btn-sm" id="btnExportarCsv" onclick="exportarCsv()">
                <i class="bi bi-download me-1"></i>Baixar CSV
              </button>
              <span class="small text-secondary ms-2">Uma linha por hora/máquina apontada. Só turnos fechados (rascunhos em andamento não entram).</span>
            </div>
          </div>
        </div>
      </div>

      <div class="card shadow-sm mb-4">
        <div
          class="card-header bg-white py-2 d-flex justify-content-between align-items-center"
        >
          <h5 class="mb-0 fw-bold text-primary">
            <i class="bi bi-list-ul me-2"></i>Turnos Encerrados
          </h5>
          <button
            class="btn btn-sm btn-outline-secondary"
            onclick="carregarTurnos()"
          >
            <i class="bi bi-arrow-clockwise me-1"></i>Atualizar
          </button>
        </div>
        <!-- Barra de ação em lote - só aparece com pelo menos 1 turno
        selecionado (checkbox só existe para ADMIN/SUPERVISOR). -->
        <div id="barraAcaoLote" class="card-body py-2 border-bottom bg-light d-none">
          <div class="d-flex align-items-center gap-2 flex-wrap">
            <span class="small fw-bold" id="contadorSelecionados">0 selecionados</span>
            <button class="btn btn-sm btn-outline-secondary" onclick="marcarSelecionadosComoTeste(true)">
              <i class="bi bi-flask me-1"></i>Marcar como teste
            </button>
            <button class="btn btn-sm btn-outline-secondary" onclick="marcarSelecionadosComoTeste(false)">
              <i class="bi bi-flask me-1"></i>Desmarcar teste
            </button>
            <button class="btn btn-sm btn-link text-secondary" onclick="limparSelecao()">Cancelar seleção</button>
          </div>
        </div>
        <div class="card-body p-0 table-responsive">
          <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="text-center d-none" id="colunaSelecaoTodos" style="width: 40px;">
                  <input type="checkbox" class="form-check-input" id="checkSelecionarTodos" onchange="alternarSelecionarTodos(this.checked)">
                </th>
                <th>Turno</th>
                <th>Responsável</th>
                <th>Data</th>
                <th class="text-center">Produção Total</th>
                <th class="text-center">Qualidade</th>
                <th class="text-center">Eficiência (OEE)</th>
                <th class="text-center">Status</th>
                <th class="text-center">Relatório</th>
              </tr>
            </thead>
            <tbody id="corpoTabelaHistorico">
              <tr>
                <td colspan="9" class="text-center text-secondary py-4">
                  Carregando...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/historico.js"></script>
  </body>
</html>
