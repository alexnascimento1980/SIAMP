<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>SIAMP - Histórico de Turnos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="bg-light">
    <!-- Barra Superior -->
    <nav class="navbar navbar-dark bg-primary px-3 shadow-sm">
      <div
        class="container-fluid d-flex justify-content-between align-items-center"
      >
        <span class="navbar-brand mb-0 h1 fw-bold">
          <i class="bi bi-clock-history me-2"></i>SIAMP • Histórico de Turnos
        </span>
        <div class="d-flex align-items-center gap-2">
          <a href="index.html" class="btn btn-sm btn-outline-light">
            <i class="bi bi-arrow-left me-1"></i>Voltar
          </a>
          <button class="btn btn-sm btn-outline-light" onclick="sair()">
            <i class="bi bi-box-arrow-right me-1"></i>Sair
          </button>
        </div>
      </div>
    </nav>

    <div class="container-fluid p-3" style="max-width: 1100px">
      <div id="alertaMsg" class="alert d-none" role="alert"></div>

      <div class="card shadow-sm mb-4">
        <div
          class="card-header bg-white py-2 d-flex justify-content-between align-items-center"
        >
          <h5 class="mb-0 fw-bold text-primary">
            <i class="bi bi-list-ul me-2"></i>Turnos Encerrados
          </h5>
          <button
            class="btn btn-sm btn-outline-secondary"
            onclick="carregarTurnos()"
          >
            <i class="bi bi-arrow-clockwise me-1"></i>Atualizar
          </button>
        </div>
        <div class="card-body p-0 table-responsive">
          <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Turno</th>
                <th>Responsável</th>
                <th>Data</th>
                <th class="text-center">Produção Total</th>
                <th class="text-center">Qualidade</th>
                <th class="text-center">Eficiência (OEE)</th>
                <th class="text-center">Status</th>
                <th class="text-center">Relatório</th>
              </tr>
            </thead>
            <tbody id="corpoTabelaHistorico">
              <tr>
                <td colspan="8" class="text-center text-secondary py-4">
                  Carregando...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/historico.js"></script>
  </body>
</html>
