<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIAMP - Máquinas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

  <!-- Barra Superior -->
  <nav class="navbar navbar-dark bg-primary px-3 shadow-sm">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <span class="navbar-brand mb-0 h1 fw-bold">
        <i class="bi bi-gear-wide-connected me-2"></i>SIAMP • Máquinas
      </span>
      <div class="d-flex align-items-center gap-2">
        <a href="index.html" class="btn btn-sm btn-outline-light">
          <i class="bi bi-arrow-left me-1"></i>Voltar
        </a>
        <button class="btn btn-sm btn-outline-light" onclick="sair()">
          <i class="bi bi-box-arrow-right me-1"></i>Sair
        </button>
      </div>
    </div>
  </nav>

  <div class="container-fluid p-3" style="max-width: 900px;">

    <div id="alertaMsg" class="alert d-none" role="alert"></div>

    <!-- Formulário de nova máquina -->
    <div class="card shadow-sm mb-3">
      <div class="card-header bg-white py-2">
        <h5 class="mb-0 fw-bold text-primary"><i class="bi bi-plus-circle me-2"></i>Nova Injetora</h5>
      </div>
      <div class="card-body p-3">
        <form id="formNovaMaquina">
          <div class="row g-2">
            <div class="col-md-2">
              <label class="form-label fw-bold text-secondary mb-1">Número</label>
              <input type="text" id="novoNumero" class="form-control" placeholder="Ex: 7" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold text-secondary mb-1">Descrição</label>
              <input type="text" id="novaDescricao" class="form-control" placeholder="Ex: Injetora 07 - Peça G">
            </div>
            <div class="col-md-3">
              <label class="form-label fw-bold text-secondary mb-1">Cavidades</label>
              <input type="number" id="novaCavidades" class="form-control" min="1" value="1" required>
            </div>
            <div class="col-md-3">
              <label class="form-label fw-bold text-secondary mb-1">Ciclo padrão (s)</label>
              <input type="number" id="novoCiclo" class="form-control" min="0.1" step="0.1" value="20" required>
            </div>
          </div>
          <div class="text-end mt-3">
            <button type="submit" id="btnCriarMaquina" class="btn btn-primary">
              <i class="bi bi-check-circle me-1"></i>Adicionar Injetora
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Lista de máquinas -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-white py-2 d-flex justify-content-between align-items-center">
        <h5 class="mb-0 fw-bold text-primary"><i class="bi bi-list-ul me-2"></i>Injetoras Cadastradas</h5>
        <div class="form-check form-switch mb-0">
          <input class="form-check-input" type="checkbox" id="chkMostrarInativas" onchange="carregarMaquinas()">
          <label class="form-check-label small text-secondary" for="chkMostrarInativas">Mostrar inativas</label>
        </div>
      </div>
      <div class="card-body p-0 table-responsive">
        <table class="table table-striped table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Número</th>
              <th>Descrição</th>
              <th class="text-center">Cavidades</th>
              <th class="text-center">Ciclo (s)</th>
              <th class="text-center">Status</th>
              <th class="text-center">Ação</th>
            </tr>
          </thead>
          <tbody id="corpoTabelaMaquinas">
            <tr><td colspan="6" class="text-center text-secondary py-3">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
    <script src="js/maquinas.js"></script>
</body>
</html>
