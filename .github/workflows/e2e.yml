name: Testes E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Credenciais e chaves aqui são só para esta execução de CI -
      # descartadas junto com o runner ao final. ADMIN_EMAIL/
      # ADMIN_SENHA precisam bater exatamente com EMAIL_ADMIN_E2E/
      # SENHA_ADMIN_E2E em e2e/conftest.py.
      - name: Criar .env para a stack de CI
        run: |
          cat > .env << 'EOF'
          POSTGRES_DB=siamp_db
          POSTGRES_USER=siamp_user
          POSTGRES_PASSWORD=senha-e2e-ci-nao-usar-em-producao
          JWT_SECRET_KEY=chave-e2e-ci-nao-usar-em-producao-${{ github.run_id }}
          SEED_ON_START=true
          ADMIN_NOME=Admin E2E
          ADMIN_EMAIL=admin-e2e@siamp.test
          ADMIN_SENHA=SenhaE2E-Testes-123
          EOF

      - name: Subir a stack (docker compose)
        run: docker compose up --build -d

      - name: Aguardar o frontend responder
        run: |
          for tentativa in $(seq 1 30); do
            if curl -sf http://localhost:8090/login.html > /dev/null; then
              echo "Frontend respondendo (tentativa $tentativa)."
              exit 0
            fi
            echo "Aguardando frontend (tentativa $tentativa/30)..."
            sleep 2
          done
          echo "Frontend não respondeu a tempo."
          docker compose logs
          exit 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: e2e/requirements.txt

      - name: Instalar dependências e navegador
        working-directory: e2e
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Rodar testes E2E
        working-directory: e2e
        env:
          # Explícito de propósito, em vez de depender do valor
          # padrão do conftest.py bater silenciosamente com o que foi
          # escrito no .env acima - evita os dois arquivos
          # dessincronizarem sem ninguém perceber no futuro.
          E2E_ADMIN_EMAIL: admin-e2e@siamp.test
          E2E_ADMIN_SENHA: SenhaE2E-Testes-123
        run: pytest -v --browser chromium --screenshot only-on-failure --output=test-results

      - name: Salvar screenshots de falha (se houver)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/test-results/
          retention-days: 7

      - name: Logs da stack (se algo falhou)
        if: failure()
        run: docker compose logs

      - name: Encerrar a stack
        if: always()
        run: docker compose down -v
