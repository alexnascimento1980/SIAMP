name: Testes E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Credenciais e chaves aqui são só para esta execução de CI -
      # descartadas junto com o runner ao final. ADMIN_EMAIL/
      # ADMIN_SENHA precisam bater exatamente com EMAIL_ADMIN_E2E/
      # SENHA_ADMIN_E2E em e2e/conftest.py.
      - name: Criar .env para a stack de CI
        run: |
          cat > .env << 'EOF'
          POSTGRES_DB=siamp_db
          POSTGRES_USER=siamp_user
          POSTGRES_PASSWORD=senha-e2e-ci-nao-usar-em-producao
          JWT_SECRET_KEY=chave-e2e-ci-nao-usar-em-producao-${{ github.run_id }}
          SEED_ON_START=true
          ADMIN_NOME=Admin E2E
          ADMIN_EMAIL=admin-e2e@siamp.test
          ADMIN_SENHA=SenhaE2E-Testes-123
          EOF

      - name: Subir a stack (docker compose)
        run: docker compose up --build -d

      - name: Aguardar a stack ficar pronta
        run: |
          echo "=== Aguardando o frontend (nginx, arquivos estáticos) ==="
          frontend_pronto=false
          for tentativa in $(seq 1 30); do
            if curl -sf http://localhost:8090/login.html > /dev/null; then
              echo "Frontend respondendo (tentativa $tentativa)."
              frontend_pronto=true
              break
            fi
            echo "Aguardando frontend (tentativa $tentativa/30)..."
            sleep 2
          done
          if [ "$frontend_pronto" = "false" ]; then
            echo "Frontend não respondeu a tempo."
            docker compose logs
            exit 1
          fi

          # O health check do backend (GET /) fica na raiz do próprio
          # backend, mas na porta pública (8090) essa mesma raiz é
          # servida pelo nginx do frontend (arquivos estáticos) - nginx
          # só repassa /api/ pra lá (ver nginx.conf.template). Por isso
          # a checagem usa um endpoint sob /api/ mesmo, e trata tanto
          # 200 quanto 401 como "pronto" (401 é a resposta CORRETA e
          # esperada de uma rota autenticada sem nenhum cookie -
          # confirma que o backend está de pé processando requisições
          # até o fim, não que "não está pronto"; só conexão recusada/
          # timeout/5xx contam como "ainda não").
          #
          # Migrations + bootstrap de admin + carga de seeds rodam
          # antes do Uvicorn nem subir, e podem levar mais tempo que o
          # nginx simples do frontend - checar só o frontend (como
          # este workflow fazia antes) não garantia que o backend já
          # tinha terminado essa sequência, causando timeout
          # intermitente no primeiro login de cada execução (mais
          # visível conforme mais migrations se acumulam ao longo do
          # projeto).
          echo "=== Aguardando o backend (API) ficar pronto de verdade ==="
          for tentativa in $(seq 1 30); do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8090/api/v1/auth/me)
            if [ "$codigo" = "200" ] || [ "$codigo" = "401" ]; then
              echo "Backend respondendo (tentativa $tentativa, código $codigo)."
              exit 0
            fi
            echo "Aguardando backend (tentativa $tentativa/30, código $codigo)..."
            sleep 2
          done
          echo "Backend não respondeu a tempo."
          docker compose logs
          exit 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: e2e/requirements.txt

      - name: Instalar dependências e navegador
        working-directory: e2e
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          # Causa raiz confirmada (depois de 3 tentativas erradas -
          # remoção em local errado, repetir a instalação, tolerar a
          # falha - nenhuma resolveu, documentadas nos commits
          # anteriores deste arquivo): o repositório apt do Google
          # Chrome está declarado em
          # /etc/apt/sources.list.d/google-chrome.sources (formato
          # DEB822 mais novo, não o .list clássico que eu tinha
          # procurado antes) - confirmado pelo diagnóstico final da
          # tentativa anterior. O índice publicado por esse
          # repositório está com hash inconsistente de forma
          # persistente (mesmo hash em execuções de dias diferentes,
          # não é uma falha de mirror que se resolve sozinha) - e não
          # é usado pelo Playwright de qualquer forma (o Chromium
          # instalado é o empacotado pelo próprio Playwright, não o
          # Google Chrome do sistema). Removendo esse arquivo
          # especificamente, com um fallback por conteúdo caso o nome
          # mude numa atualização futura da imagem do runner.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo grep -rl "dl.google.com/linux/chrome" /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f || true

          playwright install --with-deps chromium

      - name: Rodar testes E2E
        working-directory: e2e
        env:
          # Explícito de propósito, em vez de depender do valor
          # padrão do conftest.py bater silenciosamente com o que foi
          # escrito no .env acima - evita os dois arquivos
          # dessincronizarem sem ninguém perceber no futuro.
          E2E_ADMIN_EMAIL: admin-e2e@siamp.test
          E2E_ADMIN_SENHA: SenhaE2E-Testes-123
        run: pytest -v --browser chromium --screenshot only-on-failure --output=test-results

      - name: Salvar screenshots de falha (se houver)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/test-results/
          retention-days: 7

      - name: Logs da stack (se algo falhou)
        if: failure()
        run: docker compose logs

      - name: Encerrar a stack
        if: always()
        run: docker compose down -v
