name: Testes E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Credenciais e chaves aqui são só para esta execução de CI -
      # descartadas junto com o runner ao final. ADMIN_EMAIL/
      # ADMIN_SENHA precisam bater exatamente com EMAIL_ADMIN_E2E/
      # SENHA_ADMIN_E2E em e2e/conftest.py.
      - name: Criar .env para a stack de CI
        run: |
          cat > .env << 'EOF'
          POSTGRES_DB=siamp_db
          POSTGRES_USER=siamp_user
          POSTGRES_PASSWORD=senha-e2e-ci-nao-usar-em-producao
          JWT_SECRET_KEY=chave-e2e-ci-nao-usar-em-producao-${{ github.run_id }}
          SEED_ON_START=true
          ADMIN_NOME=Admin E2E
          ADMIN_EMAIL=admin-e2e@siamp.test
          ADMIN_SENHA=SenhaE2E-Testes-123
          EOF

      - name: Subir a stack (docker compose)
        run: docker compose up --build -d

      - name: Aguardar o frontend responder
        run: |
          for tentativa in $(seq 1 30); do
            if curl -sf http://localhost:8090/login.html > /dev/null; then
              echo "Frontend respondendo (tentativa $tentativa)."
              exit 0
            fi
            echo "Aguardando frontend (tentativa $tentativa/30)..."
            sleep 2
          done
          echo "Frontend não respondeu a tempo."
          docker compose logs
          exit 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: e2e/requirements.txt

      - name: Instalar dependências e navegador
        working-directory: e2e
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          # Histórico de tentativas anteriores que não resolveram,
          # documentado aqui pra não repetir:
          # 1. Buscar e remover a declaração da fonte apt do Chrome em
          #    /etc/apt/sources.list.d/ e /etc/apt/sources.list, por
          #    nome de arquivo e por conteúdo - o diagnóstico impresso
          #    no log não encontrou nada nesses dois lugares.
          # 2. Repetir "playwright install --with-deps" 3 vezes - os
          #    hashes "esperado"/"recebido" do erro são IDÊNTICOS em
          #    todas as tentativas e entre execuções de dias
          #    diferentes, descartando "mirror momentaneamente
          #    inconsistente" (isso mudaria com o tempo).
          #
          # Pista nova: "Last modification reported" e "Release file
          # created at" no erro têm ~8h de diferença - não é o padrão
          # de uma corrida de poucos segundos entre publicação e
          # réplica em um mirror, é mais consistente com a IMAGEM do
          # runner já vir com um índice desse pacote pré-baixado e
          # desatualizado. Abordagem desta vez: limpar o cache de
          # índices já baixados (não só a declaração da fonte), tolerar
          # explicitamente a falha SÓ desse repositório específico (os
          # outros, confirmados nos logs anteriores, sempre atualizam
          # com sucesso - não são o problema), e instalar as
          # dependências de SO separadamente do download do navegador,
          # com um retrocesso em camadas se ainda assim travar em
          # algum ponto - cada camada imprime onde exatamente parou,
          # pra não precisar adivinhar de novo numa próxima rodada.
          echo "=== Limpando cache de índices de pacotes já baixados ==="
          sudo rm -rf /var/lib/apt/lists/*

          echo "=== apt-get update (tolerando falha do repositório do Chrome - não usado pelo Playwright) ==="
          sudo apt-get update || echo "apt-get update falhou para pelo menos um repositório (esperado: só o do Chrome) - seguindo mesmo assim, os repositórios realmente necessários confirmam sucesso acima."

          echo "=== Tentativa 1: playwright install-deps + install separados ==="
          if playwright install-deps chromium && playwright install chromium; then
            echo "Sucesso na tentativa 1."
          else
            echo "=== Tentativa 1 falhou. Tentativa 2: playwright install --with-deps (combinado) ==="
            if playwright install --with-deps chromium; then
              echo "Sucesso na tentativa 2."
            else
              echo "=== Tentativa 2 também falhou. Diagnóstico final antes de desistir: ==="
              sudo find /etc/apt/ -type f -exec grep -l "google" {} \; 2>/dev/null || echo "(nenhum arquivo em /etc/apt/ menciona 'google')"
              exit 1
            fi
          fi

      - name: Rodar testes E2E
        working-directory: e2e
        env:
          # Explícito de propósito, em vez de depender do valor
          # padrão do conftest.py bater silenciosamente com o que foi
          # escrito no .env acima - evita os dois arquivos
          # dessincronizarem sem ninguém perceber no futuro.
          E2E_ADMIN_EMAIL: admin-e2e@siamp.test
          E2E_ADMIN_SENHA: SenhaE2E-Testes-123
        run: pytest -v --browser chromium --screenshot only-on-failure --output=test-results

      - name: Salvar screenshots de falha (se houver)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/test-results/
          retention-days: 7

      - name: Logs da stack (se algo falhou)
        if: failure()
        run: docker compose logs

      - name: Encerrar a stack
        if: always()
        run: docker compose down -v
